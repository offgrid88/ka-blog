# Upstream definitions
upstream offgrid {
    server web:5000;
}

upstream code {
    server code-server:8443;
}

# Default server block to catch all unspecified requests
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    ssl_certificate /etc/letsencrypt/live/default/fullchain.pem;  # Adjust if you have a default certificate
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;  # Adjust if you have a default certificate
    return 444 'What are you doing? Nothing here, get lost!';
}

# Server for otom8.systems
server {
    server_name otom8.systems;
    listen 443 ssl;  # Managed by Certbot

    location / {
        default_type text/plain;
        return 200 'We build Robots that coexists with Humans!';
    }

    ssl_certificate /etc/letsencrypt/live/otom8.systems/fullchain.pem;  # Managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/otom8.systems/privkey.pem;  # Managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;  # Managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # Managed by Certbot
}

server {
    listen 80;
    server_name otom8.systems;
    return 301 https://$host$request_uri;  # Managed by Certbot
}

# Server for code.aymenrachdi.xyz
server {
    server_name code.aymenrachdi.xyz;
    listen 443 ssl;  # Managed by Certbot
    listen [::]:443 ssl ipv6only=on;  # Managed by Certbot

    location / {
        proxy_pass http://code;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding gzip;
    }

    ssl_certificate /etc/letsencrypt/live/code.aymenrachdi.xyz/fullchain.pem;  # Managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/code.aymenrachdi.xyz/privkey.pem;  # Managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;  # Managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # Managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name code.aymenrachdi.xyz;
    return 301 https://$host$request_uri;  # Managed by Certbot
}

# Server for sync.aymenrachdi.xyz
server {
    server_name sync.aymenrachdi.xyz;
    listen 443 ssl;  # Managed by Certbot

    access_log /var/log/nginx/offgrid-sync-access.log;
    error_log /var/log/nginx/offgrid-sync-error.log;

    location / {
        proxy_set_header Host $host;
        proxy_set_header Referer http://syncthing:8384;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://syncthing:8384/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    ssl_certificate /etc/letsencrypt/live/sync.aymenrachdi.xyz/fullchain.pem;  # Managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sync.aymenrachdi.xyz/privkey.pem;  # Managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;  # Managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # Managed by Certbot
}

server {
    listen 80;
    server_name sync.aymenrachdi.xyz;
    return 301 https://$host$request_uri;  # Managed by Certbot
}

# Server for mail.aymenrachdi.xyz
server {
    server_name mail.aymenrachdi.xyz;

    listen 80;
    listen [::]:80;

    location / {
        default_type text/plain;
        return 200 "This is just a private mailserver. Very private. Don't brute force it or crawl it. There is nothing here to find.";
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;  # Make sure this directory exists and Certbot can write to it
        try_files $uri =404; # Serve the challenge files or return 404
    }
}

