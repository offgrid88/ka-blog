# Default server for catching all other requests
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444 'What are you doing? Nothing here, get lost!';
}

upstream offgrid {
    server web:8080;
}


#upstream oak-link {
#    server 172.21.0.1:8080;
#}

upstream code {
server code-server:8443;
}



server {
    server_name otom8.systems;

    location / {
        default_type text/plain;
        return 200 'We build Robots that coexists with Humans!';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/otom8.systems/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/otom8.systems/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    server_name mail.aymenrachdi.xyz;

    listen 80;
    listen [::]:80;

    location / {
        default_type text/plain;
        return 200 "This is just a private mailserver. Very private. Don't brute force it or crawl it. There is nothing here to find.";
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;  # Make sure this directory exists and Certbot can write to it
        try_files $uri =404; # Serve the challenge files or return 404
    }
}



server {
    server_name code.aymenrachdi.xyz;

    location / {
      proxy_pass http://code;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header Accept-Encoding gzip;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/code.aymenrachdi.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/code.aymenrachdi.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name sync.aymenrachdi.xyz;
    access_log /var/log/nginx/offgrid-sync-access.log;
    error_log /var/log/nginx/offgrid-sync-error.log;
    
    location / {
        proxy_set_header        Host $host;
	proxy_set_header        Referer  http://syncthing:8384;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        
	#rewrite    /syncthing/(.*) /$1 break;
	proxy_pass  http://syncthing:8384/;
	
	proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }


     


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sync.aymenrachdi.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sync.aymenrachdi.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}




