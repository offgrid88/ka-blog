

services:
  web:
     build:
       context: ./services/web/quartz
       dockerfile: Dockerfile
     restart: always
     ports:
       - "8080:8080"
     volumes:
       - ./services/web/quartz:/usr/src/app
       - ./services/web/content/blog:/usr/src/app/content
       - /usr/src/app/node_modules
       
     healthcheck:
        test: ["CMD", "curl", "127.0.0.1:5000"]
        interval: 30s
        timeout: 10s
        retries: 3

     command: ["npx", "quartz", "build", "--serve"]
     environment:
       - NODE_ENV=development
     networks:
       - shared_network

  nginxmanager:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    #environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./wordpress:/var/www/html
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - shared_network

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: sync.aymenrachdi.xyz
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./appdata/config:/config
      - ./services/web/content:/config/content
      - ./data1:/data1
      - ./data2:/data2
     
    ports:
      - 8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - shared_network

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=aymenrachdi.xyz #optional
      - SERVERPORT=51820 #optional
      - PEERS=100 #optional
      - PEERDNS=auto #optional
      - INTERNAL_SUBNET=10.13.13.0 #optional
      - ALLOWEDIPS=0.0.0.0/0 #optional
      - PERSISTENTKEEPALIVE_PEERS=all #optional
      - LOG_CONFS=true #optional
    volumes:
      - ./services/wg/config:/config
      - /lib/modules:/lib/modules #optional
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=Kernaug_758400 #optional
      - DEFAULT_WORKSPACE=/config/content #optional
    volumes:
      - ./appdata/config:/config
      - ./services/web/content:/config/content
    ports:
      - 8443:8443
    restart: unless-stopped
    networks:
      - shared_network

  #################################################################
  # Stalwart Mail Server
  #################################################################
  stalwart-mail:
    image: stalwartlabs/mail-server:latest
    container_name: stalwart-mail
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "110:110"
      - "995:995"
    volumes:
      - ./stalwart-mail:/opt/stalwart-mail
      - ./backups:/opt/stalwart-mail/backups
      - ./certbot/conf:/etc/letsencrypt
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shared_network
 #################################################################
      
  certbot:
        stdin_open: true
        tty: true
        volumes:
            - ${PWD}/docker-data/certbot/certs/:/etc/letsencrypt/
            - ${PWD}/docker-data/certbot/logs/:/var/log/letsencrypt/
            - ./services/nginx/webroot:/var/www/certbot
        image: certbot/certbot
        command: renew --webroot --webroot-path=/var/www/certbot

networks:
  shared_network:
    external: true

